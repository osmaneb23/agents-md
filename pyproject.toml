[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-context-md"
version = "0.2.2"
description = "Generate short, useful AGENTS.md files without repeating what the repo already says."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Osmane B." }]
keywords = ["agents.md", "ai", "cli", "codex", "claude", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.76"]
openai = ["openai>=2.9"]
gemini = ["google-genai>=1.52"]
dev = ["build>=1.3", "pytest>=9.0"]

[project.urls]
Homepage = "https://github.com/osmaneb23/agents-md"
Issues = "https://github.com/osmaneb23/agents-md/issues"
Security = "https://github.com/osmaneb23/agents-md/blob/main/SECURITY.md"

[project.scripts]
agents-md = "agents_md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
